name: Apply light research intelligence UI

on:
  push:
    branches: [main]
    paths:
      - ".streamlit/config.toml"
      - ".github/workflows/light-research-intelligence-ui.yml"
      - "scripts/apply_research_intelligence_ui.py"

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Update checkout
        run: git pull --rebase origin main
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"
      - name: Apply presentation-only redesign
        run: python scripts/apply_research_intelligence_ui.py
      - name: Validate Python and repository data
        run: |
          python -m py_compile app.py
          python -m pytest -q
          python scripts/validate_data.py
      - name: Streamlit smoke test
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            --browser.gatherUsageStats false \
            > /tmp/streamlit-ui.log 2>&1 &
          APP_PID=$!
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              kill "$APP_PID" || true
              wait "$APP_PID" || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit-ui.log
          kill "$APP_PID" || true
          wait "$APP_PID" || true
          exit 1
      - name: Commit verified UI and remove one-off migration
        run: |
          rm scripts/apply_research_intelligence_ui.py
          rm .github/workflows/light-research-intelligence-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .streamlit/config.toml docs/RESEARCH_PORTAL_UX.md \
            scripts/apply_research_intelligence_ui.py \
            .github/workflows/light-research-intelligence-ui.yml
          git commit -m "Redesign tracker as a light research intelligence portal [skip ci]"
          git push origin HEAD:main
