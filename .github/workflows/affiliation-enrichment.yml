name: Enrich research affiliations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/affiliation-enrichment.yml"
      - "scripts/enrich_affiliations.py"
      - "src/chiral_scanner/affiliation_enrichment.py"
      - "src/chiral_scanner/research_geography.py"
  schedule:
    - cron: "25 5,17 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum mapped papers to enrich in this run"
        required: false
        default: "60"
        type: string
      retry_days:
        description: "Days before retrying a scientifically unresolved affiliation"
        required: false
        default: "14"
        type: string

permissions:
  contents: write

concurrency:
  # Share the archive write lock with scanning/classification so data commits cannot collide.
  group: chiral-archive-writes
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update checkout before enrichment
        run: git pull --rebase origin main
      - name: Enrich mapped papers from arXiv and OpenAlex
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_RETRY_DAYS: ${{ inputs.retry_days }}
        run: |
          LIMIT="${INPUT_LIMIT:-60}"
          RETRY_DAYS="${INPUT_RETRY_DAYS:-14}"
          python scripts/enrich_affiliations.py \
            --input data/papers.json \
            --output data/paper_affiliations.json \
            --state data/affiliation_enrichment_state.json \
            --limit "$LIMIT" \
            --retry-days "$RETRY_DAYS"
      - name: Validate affiliation output and geography integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          affiliations = json.loads(Path("data/paper_affiliations.json").read_text())
          assert affiliations["schema_version"] == 1
          assert isinstance(affiliations["institutions"], dict)
          assert isinstance(affiliations["papers"], dict)
          assert isinstance(affiliations["unresolved"], dict)
          for paper_id, paper in affiliations["papers"].items():
              assert paper_id == paper["paper_id"]
              assert paper["authors"]
              for author in paper["authors"]:
                  assert isinstance(author.get("institution_ids", []), list)
          PY
          pytest -q tests/test_affiliation_enrichment.py tests/test_research_geography.py
          python scripts/validate_data.py
      - name: Commit affiliation data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_affiliations.json data/affiliation_enrichment_state.json
          if git diff --cached --quiet; then
            echo "No affiliation changes"
          else
            git commit -m "Update paper affiliation metadata"
            git push origin HEAD:main
          fi
