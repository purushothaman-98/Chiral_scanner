name: Enrich research affiliations

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/affiliation-enrichment.yml"
      - "scripts/enrich_affiliations.py"
      - "src/chiral_scanner/affiliation_enrichment.py"
      - "src/chiral_scanner/affiliation_enrichment_resilient.py"
      - "src/chiral_scanner/research_geography.py"
      - "tests/test_affiliation_enrichment.py"
      - "tests/test_affiliation_enrichment_resilient.py"
      - "tests/test_first_corresponding_author_map.py"
      - "tests/test_research_geography.py"
  schedule:
    - cron: "25 5,17 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum mapped papers to enrich in this run"
        required: false
        default: "60"
        type: string
      retry_days:
        description: "Days before retrying a scientifically unresolved affiliation"
        required: false
        default: "14"
        type: string

permissions:
  contents: write

concurrency:
  # Share the archive write lock with scanning/classification so data commits cannot collide.
  group: chiral-archive-writes
  # A commit tagged [restart-affiliation] may cancel only the currently active
  # archive writer for a controlled recovery. Normal runs always wait.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[restart-affiliation]') }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update checkout before enrichment
        run: git pull --rebase origin main
      - name: Enrich first and corresponding author institutions
        id: enrich
        env:
          # Store this only at Settings -> Secrets and variables -> Actions -> Secrets.
          # GitHub masks the value and exposes it only to this step.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          METADATA_CONTACT_EMAIL: ${{ vars.METADATA_CONTACT_EMAIL }}
          ROR_CLIENT_ID: ${{ vars.ROR_CLIENT_ID }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_RETRY_DAYS: ${{ inputs.retry_days }}
        run: |
          if [[ -n "$OPENALEX_API_KEY" ]]; then
            echo "OpenAlex API key is configured for this run."
          else
            echo "::warning::OPENALEX_API_KEY is missing; Crossref and ROR fallback will be used."
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # A code-change push can safely advance a moderate batch. Scheduled/manual
            # runs remain the main bulk-enrichment path.
            LIMIT="${INPUT_LIMIT:-20}"
          else
            LIMIT="${INPUT_LIMIT:-60}"
          fi
          RETRY_DAYS="${INPUT_RETRY_DAYS:-14}"

          set +e
          timeout --signal=TERM 20m python scripts/enrich_affiliations.py \
            --input data/papers.json \
            --output data/paper_affiliations.json \
            --state data/affiliation_enrichment_state.json \
            --limit "$LIMIT" \
            --retry-days "$RETRY_DAYS" \
            2>&1 | tee /tmp/affiliation-enrichment.log
          STATUS=${PIPESTATUS[0]}
          set -e

          export ENRICH_EXIT_CODE="$STATUS"
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          output_path = Path("data/paper_affiliations.json")
          state_path = Path("data/affiliation_enrichment_state.json")
          log_path = Path("/tmp/affiliation-enrichment.log")

          def read(path, fallback):
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return fallback
              return value if isinstance(value, dict) else fallback

          generated = datetime.now(UTC).isoformat()
          scoped_description = (
              "Paper-specific first-author and explicitly identified corresponding-author "
              "affiliations from arXiv/OpenAlex/Crossref/ROR; uncertain identities remain unresolved."
          )
          output = read(
              output_path,
              {
                  "schema_version": 2,
                  "description": scoped_description,
                  "author_scope": "first_and_corresponding",
                  "generated_at": generated,
                  "eligible_field_papers": 0,
                  "resolved_papers": 0,
                  "unresolved_papers": 0,
                  "institutions": {},
                  "papers": {},
                  "unresolved": {},
              },
          )
          exit_code = int(os.environ["ENRICH_EXIT_CODE"])
          if exit_code == 0:
              output["schema_version"] = 2
              output["description"] = scoped_description
              output["author_scope"] = "first_and_corresponding"

          state = read(state_path, {"schema_version": 2, "attempts": {}})
          log_tail = ""
          try:
              log_tail = log_path.read_text(encoding="utf-8", errors="replace")[-12000:]
          except OSError:
              pass
          state.update(
              {
                  "schema_version": 2,
                  "runner_status": "success" if exit_code == 0 else "failed",
                  "runner_exit_code": exit_code,
                  "runner_event": os.environ.get("GITHUB_EVENT_NAME"),
                  "runner_commit": os.environ.get("GITHUB_SHA"),
                  "runner_recorded_at": generated,
                  "runner_log_tail": log_tail,
              }
          )
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(output, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          state_path.write_text(
              json.dumps(state, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Validate affiliation output and geography integration
        id: validate
        if: steps.enrich.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          affiliations = json.loads(Path("data/paper_affiliations.json").read_text())
          assert affiliations["schema_version"] == 2
          assert affiliations["author_scope"] == "first_and_corresponding"
          assert isinstance(affiliations["institutions"], dict)
          assert isinstance(affiliations["papers"], dict)
          assert isinstance(affiliations["unresolved"], dict)
          for paper_id, paper in affiliations["papers"].items():
              assert paper_id == paper["paper_id"]
              assert paper.get("author_scope") == "first_and_corresponding"
              assert paper["authors"]
              for author in paper["authors"]:
                  roles = set(author.get("author_roles", []))
                  assert roles
                  assert roles <= {"first", "corresponding"}
                  assert isinstance(author.get("institution_ids", []), list)
          PY
          pytest -q \
            tests/test_affiliation_enrichment.py \
            tests/test_affiliation_enrichment_resilient.py \
            tests/test_first_corresponding_author_map.py \
            tests/test_research_geography.py
          python scripts/validate_data.py
      - name: Commit affiliation data and retry diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper_affiliations.json data/affiliation_enrichment_state.json
          if git diff --cached --quiet; then
            echo "No affiliation changes"
          else
            git commit -m "Update paper affiliation metadata"
            git push origin HEAD:main
          fi
      - name: Report enrichment or validation failure after diagnostics are saved
        if: always()
        env:
          ENRICH_EXIT_CODE: ${{ steps.enrich.outputs.exit_code }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("data/affiliation_enrichment_state.json").read_text())
          exit_code = str(os.environ.get("ENRICH_EXIT_CODE") or "")
          validation = str(os.environ.get("VALIDATION_OUTCOME") or "")
          selected = int(state.get("selected", 0))
          errors = int(state.get("errors", 0))
          if exit_code != "0":
              raise SystemExit(
                  f"Affiliation runner exited with code {exit_code}; diagnostics were committed."
              )
          if validation != "success":
              raise SystemExit(
                  f"Affiliation validation outcome was {validation}; diagnostics were committed."
              )
          if selected and errors == selected:
              raise SystemExit(
                  "All selected affiliation lookups failed. "
                  "Diagnostics were committed and the papers remain retryable."
              )
          PY
