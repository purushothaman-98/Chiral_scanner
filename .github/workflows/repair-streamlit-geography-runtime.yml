name: Repair Streamlit geography runtime

on:
  issues:
    types: [opened]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: github.event_name != 'issues' || github.event.issue.title == '[runtime-repair] Streamlit geography'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Update checkout
        run: git pull --rebase origin main
      - name: Patch live geography loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from chiral_scanner.research_geography import institution_activity\n"
          new_import = '''import chiral_scanner.research_geography as geography_data

# Streamlit reruns app.py inside a long-lived process and normally keeps imported modules cached.
# Reload geography explicitly so data-only affiliation commits cannot leave the live map on the
# old manual-registry implementation.
importlib.invalidate_caches()
geography_data = importlib.reload(geography_data)
institution_activity = geography_data.institution_activity
'''
          if old_import not in text:
              raise SystemExit("Expected research_geography import was not found")
          text = text.replace(old_import, new_import, 1)

          old_call = "    institutions, institution_links, geo_coverage = institution_activity(approved)\n"
          new_call = '''    # Read the automatic affiliation database from the same checkout as app.py.
    # Passing it explicitly avoids stale module-relative paths and makes data-only commits visible
    # immediately after a Streamlit rerun.
    paper_affiliations = load_json(
        DATA / "paper_affiliations.json",
        {"institutions": {}, "papers": {}, "unresolved": {}, "generated_at": None},
    )
    institutions, institution_links, geo_coverage = institution_activity(
        approved,
        paper_affiliations=paper_affiliations,
    )
'''
          if old_call not in text:
              raise SystemExit("Expected institution_activity call was not found")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"
      - name: Verify geography integration
        run: |
          python -m pytest -q \
            tests/test_first_corresponding_author_map.py \
            tests/test_research_geography.py
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/paper_affiliations.json").read_text(encoding="utf-8"))
          assert data.get("schema_version") == 2
          assert data.get("resolved_papers", 0) >= 100
          assert len(data.get("papers", {})) >= 100
          print(
              f"Verified automatic geography input: {len(data['papers'])} resolved papers, "
              f"{len(data.get('institutions', {}))} institution records"
          )
          PY
      - name: Commit runtime repair and remove one-off workflow
        run: |
          rm .github/workflows/repair-streamlit-geography-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/repair-streamlit-geography-runtime.yml
          git commit -m "Reload live affiliation data in Streamlit geography"
          git push origin HEAD:main
      - name: Close repair trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
