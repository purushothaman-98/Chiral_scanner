name: Dispatch compact geography refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/ui-refine-trigger"

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Launch geography refinement
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run compact-geography-ui.yml --repo "${{ github.repository }}"
